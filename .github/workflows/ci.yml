name: CI

on:
  pull_request:
  push:
    branches: [master]

# cancel previous jobs on the branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    runs-on: ubuntu-latest
    # A hung compile once burned the full 6h default. Fail fast; a healthy
    # run takes minutes. See also max-silent-time below.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            max-silent-time = 1200

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: stackage-infrastructure
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Build
        run: nix build -L

      - name: Build shells
        if: github.event_name == 'push'
        run: |
          nix build -L .#devShells.x86_64-linux.default --out-link result-shell-default
          nix build -L .#devShells.x86_64-linux.stack --out-link result-shell-stack

  stack-test:
    runs-on: ubuntu-latest
    # Disabled while stack doesn't support Cabal-3.18.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            max-silent-time = 1200

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: stackage-infrastructure

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-deps-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'all-cabal-tool.cabal') }}
          restore-keys: |
            stack-deps-${{ runner.os }}-

      - name: Test
        run: stack --nix-pure test --fast --no-interleaved-output

  cabal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            max-silent-time = 1200

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: stackage-infrastructure

      - name: Test
        run: nix develop -c cabal test -O0
